name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the extension zip
        run: zip -r -X "futfusion-sbc-$VERSION.zip" manifest.json icons src LICENSE LICENSE-FutFox README.md INTEGRATION.md docs
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the zip
        run: cosign sign-blob --yes --bundle "futfusion-sbc-$VERSION.zip.sigstore.json" "futfusion-sbc-$VERSION.zip"
      # The same zip under a fixed name, so releases/latest/download/futfusion-sbc.zip always gets the
      # newest version. The signature covers the bytes, so the same bundle verifies both names.
      - name: Add copies with a fixed name
        run: |
          cp "futfusion-sbc-$VERSION.zip" futfusion-sbc.zip
          cp "futfusion-sbc-$VERSION.zip.sigstore.json" futfusion-sbc.zip.sigstore.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "FutFusion SBC $VERSION" --notes-file "docs/UPGRADE-$VERSION.md"
          "futfusion-sbc-$VERSION.zip" "futfusion-sbc-$VERSION.zip.sigstore.json" futfusion-sbc.zip futfusion-sbc.zip.sigstore.json
